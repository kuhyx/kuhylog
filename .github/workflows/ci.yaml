name: ci

on:
  push:
    # This repository's default branch is master; main is listed too so the
    # workflow keeps firing if it is ever renamed.
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test with a 100% coverage gate
        run: ./tool/coverage.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lcov
          path: coverage/lcov.info

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - run: flutter pub get

      # Never run in the sandbox this repository was authored in, which
      # had no Android SDK. This job is the first place the APK is
      # actually built; treat a failure here as expected-until-proven.
      - name: Build a debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: kuhylog-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

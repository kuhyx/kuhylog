name: kuhylog
description: >-
  Local-first life tracker: arbitrary trackers, people and context captured as
  one plain-text note per event. A clean-room reimplementation of the Nomie 5
  capture model with a Nomie backup/CSV importer.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  # The shared palette and scales. This app used to derive its own colours
  # from a blue seed -- the only one in the fleet doing so.
  design_system:
    git:
      url: https://github.com/kuhyx/utils
      ref: design_system-v0.1.0
      path: design_system

  flutter:
    sdk: flutter
  path_provider: ^2.1.5

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.0.0

flutter:
  uses-material-design: true

# Generated from the shared icon family; regenerate with
# `python3 -m python_pkg.app_icons generate --app kuhylog --android`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#211D1B"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"
  min_sdk_android: 21
